[package]
name = "rea-movie"
version = "0.1.0"
edition = "2021"
authors = ["rea-movie contributors"]
description = "Reverse-engineer any movie into reproducible MiniMax-H3 multi-shot project"

[[bin]]
name = "rea-movie"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tempfile = "3.10"
hound = "3.5"
base64 = "0.22"
